name: Prose lint

on:
  pull_request:
    paths:
      - "blog/**"
      - "docs/**"
      - "src/pages/case-studies/**"

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@v2
        with:
          files: '["blog", "docs", "src/pages/case-studies"]'
          fail_on_error: false
